
name: Build Private Access APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract Android project
        run: |
          unzip -q PrivateAccess_Android_Starter.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/output/PrivateAccess.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Private-Access-APK
          path: output/PrivateAccess.apk
